info:
  name: Update Admin Platform Fee Settings
  type: http
  seq: 13

http:
  method: PATCH
  url: 127.0.0.1:4000/api/v1/admin/settings/platform-fee
  body:
    type: json
    data: |-
      {
        "flatFeeBelowThreshold": 100,
        "thresholdAmount": 3500,
        "percentAboveThreshold": 0.03
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
